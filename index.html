<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When's the date countdown</title>
  
  <!-- Curated Google Fonts Organized by Event Vibe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Castoro+Titling&family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400;700&family=Comfortaa:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Serif+Display&family=Fredoka:wght@400;600&family=Great+Vibes&family=Italiana&family=Jost:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Marcellus&family=Montserrat:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&family=Prata&family=Quicksand:wght@400;600&family=Righteous&family=Sacramento&family=Shrikhand&family=Space+Grotesk:wght@400;600&family=Spectral:ital,wght@0,400;0,600&family=Syne:wght@500;700&family=Tangerine:wght@700&family=WindSong:wght@500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      user-select: none;
    }

    /* Embedded Mode (Inside Canva) */
    body.is-embed {
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* App Header (Generator Only) */
    .app-header {
      text-align: center;
      margin: 40px 0 20px;
    }

    .app-header h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.85rem;
      letter-spacing: 0.12em;
      color: #1e1b18;
      text-transform: uppercase;
      font-weight: 500;
    }

    .app-header p {
      font-size: 0.88rem;
      color: #78716c;
      margin-top: 6px;
      letter-spacing: 0.04em;
    }

    /* Live Preview Stage */
    .preview-stage {
      width: 95%;
      max-width: 860px;
      background: #faf8f5;
      border: 1px solid #ebd9c8;
      border-radius: 16px;
      padding: 50px 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px -2px rgba(46, 38, 32, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }

    body.is-embed .preview-stage {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
    }

    /* Floating Countdown Container */
    .embed-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .countdown-title {
      text-align: center;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 16px;
      line-height: 1.2;
      transition: color 0.2s ease;
    }

    .countdown-title.pos-below {
      margin-top: 20px;
      margin-bottom: 0;
      order: 2;
    }

    .countdown-display {
      display: inline-flex;
      justify-content: center;
      align-items: flex-start;
      order: 1;
    }

    .unit-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Tabular monospaced numbers to eliminate jitter completely */
    .num-slot {
      text-align: center;
      line-height: 1;
      display: inline-block;
      min-width: 2.2ch;
      font-variant-numeric: tabular-nums;
      -webkit-font-feature-settings: "tnum";
      font-feature-settings: "tnum";
      transition: color 0.2s ease;
    }

    .unit-label {
      text-align: center;
      line-height: 1;
      transition: color 0.2s ease;
      font-weight: 500;
    }

    .colon-separator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-weight: 300;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    /* Generator Studio Controls */
    .generator-panel {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 16px;
      padding: 30px;
      width: 95%;
      max-width: 860px;
      margin-bottom: 60px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      color: #1c1917;
    }

    .section-title {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #78716c;
      margin: 22px 0 12px;
      border-bottom: 1px solid #f5f5f4;
      padding-bottom: 6px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.82rem;
      font-weight: 500;
      color: #44403c;
    }

    input, select {
      padding: 10px 12px;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fafaf9;
      outline: none;
      color: #1c1917;
    }

    input:focus, select:focus {
      border-color: #b38f4e;
      background: #ffffff;
    }

    .toggles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      background: #fafaf9;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #e7e5e4;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #292524;
    }

    .output-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e7e5e4;
    }

    .output-url {
      width: 100%;
      padding: 12px;
      font-family: monospace;
      font-size: 0.82rem;
      background: #f5f5f4;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .copy-btn {
      width: 100%;
      background: #1c1917;
      color: #fbf9f5;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #b38f4e;
    }
  </style>
</head>
<body>

  <!-- App Header (Hidden when embedded) -->
  <header class="app-header" id="appHeader">
    <h1>When's the date countdown</h1>
    <p>Minimalist, transparent countdown embeds for Canva designs & websites</p>
  </header>

  <!-- Centered Live Countdown Stage -->
  <div class="preview-stage" id="previewStage">
    <div class="embed-wrapper" id="embedWrapper">
      <div class="countdown-title" id="titleDisplay">Until We Say I Do</div>
      <div class="countdown-display" id="timerDisplay"></div>
    </div>
  </div>

  <!-- Admin Studio Generator -->
  <div class="generator-panel" id="adminPanel">
    
    <!-- Title & Date -->
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="eventDate">Target Event Date & Time</label>
        <input type="datetime-local" id="eventDate">
      </div>

      <div class="form-group">
        <label for="titleText">Countdown Title / Names</label>
        <input type="text" id="titleText" value="Until We Say I Do">
      </div>

      <div class="form-group">
        <label for="titlePosition">Title Position</label>
        <select id="titlePosition">
          <option value="above">Above Numbers</option>
          <option value="below">Below Numbers</option>
          <option value="none">Hidden / Off (Numbers only)</option>
        </select>
      </div>
    </div>

    <!-- Font Selector Divided by Event Categories -->
    <div class="section-title">Typography by Event Type</div>
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="fontSelect">Select Event Aesthetic</label>
        <select id="fontSelect">
          <optgroup label="💍 Weddings & Elegance (Luxury Serifs & Scripts)">
            <option value="cormorant" selected>Cormorant Garamond (Default — Editorial Luxury Serif)</option>
            <option value="cinzel">Cinzel (Regal Classical Roman)</option>
            <option value="cinzel-dec">Cinzel Decorative (Flourished Crest Roman)</option>
            <option value="pinyon">Pinyon Script (Aristocratic Wedding Calligraphy)</option>
            <option value="alex-brush">Alex Brush (Flowing Ceremony Script)</option>
            <option value="great-vibes">Great Vibes (Formal Graceful Cursive)</option>
            <option value="prata">Prata (Soft High-End Editorial Serif)</option>
          </optgroup>

          <optgroup label="🎂 Birthdays & Milestones (Joyful, Playful & Bold)">
            <option value="quicksand">Quicksand (Warm, Friendly Rounded Modern)</option>
            <option value="comfortaa">Comfortaa (Geometric Soft & Celebratory)</option>
            <option value="fredoka">Fredoka (Fun, Chunky & Cheerful)</option>
            <option value="shrikhand">Shrikhand (Retro Festive Poster Display)</option>
            <option value="dm-serif">DM Serif Display (Bold Celebration Serif)</option>
            <option value="allura">Allura (Charming Sweet 16 / Debut Script)</option>
          </optgroup>

          <optgroup label="🥂 Anniversaries, Galas & Romance (High Contrast & Drama)">
            <option value="bodoni">Bodoni Moda (Vogue-Style Fashion Serif)</option>
            <option value="playfair">Playfair Display (Dramatic Roman Drama)</option>
            <option value="italiana">Italiana (Ultra-Chic Italian Elegance)</option>
            <option value="tangerine">Tangerine (Tall Golden Age Calligraphy)</option>
            <option value="parisienne">Parisienne (Romantic European Bistro Cursive)</option>
            <option value="windsong">WindSong (Artistic Modern Flourish)</option>
          </optgroup>

          <optgroup label="🏛️ Corporate, Launches & Conferences (Modern & Architectural)">
            <option value="montserrat">Montserrat (Clean Universal Architecture)</option>
            <option value="jost">Jost (German Bauhaus Precision)</option>
            <option value="outfit">Outfit (Contemporary Clean Tech)</option>
            <option value="space-grotesk">Space Grotesk (Modernist Product Launch)</option>
            <option value="castoro">Castoro Titling (Stately Institutional Serif)</option>
          </optgroup>

          <optgroup label="🍸 Cocktails, Parties & Celebrations (Chic & Casual)">
            <option value="syne">Syne (Avant-Garde Designer Display)</option>
            <option value="righteous">Righteous (Art Deco Modern Cocktail)</option>
            <option value="marcellus">Marcellus (Clean Roman Flare)</option>
            <option value="lora">Lora (Contemporary Calligraphic Serif)</option>
            <option value="sacramento">Sacramento (Delicate Cocktail Monoline)</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label for="fontSize">Digit Font Size (px)</label>
        <input type="number" id="fontSize" value="54" min="18" max="150">
      </div>

      <div class="form-group">
        <label for="titleSize">Title Font Size (px)</label>
        <input type="number" id="titleSize" value="14" min="10" max="60">
      </div>
    </div>

    <!-- Units Toggle Grid -->
    <div class="section-title">Units to Display</div>
    <div class="toggles-grid">
      <label class="toggle-item"><input type="checkbox" id="showYears"> Years</label>
      <label class="toggle-item"><input type="checkbox" id="showMonths"> Months</label>
      <label class="toggle-item"><input type="checkbox" id="showDays" checked> Days</label>
      <label class="toggle-item"><input type="checkbox" id="showHours" checked> Hours</label>
      <label class="toggle-item"><input type="checkbox" id="showMins" checked> Mins</label>
      <label class="toggle-item"><input type="checkbox" id="showSecs" checked> Secs</label>
    </div>

    <!-- Color Palette -->
    <div class="section-title">Palette Harmonization</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="textColor">Primary Digits & Labels Color</label>
        <input type="color" id="textColor" value="#2e2620">
      </div>

      <div class="form-group">
        <label for="lastDigitColor">Last Unit Accent Color (Final ticking unit & label)</label>
        <input type="color" id="lastDigitColor" value="#b38f4e">
      </div>

      <div class="form-group full-width">
        <label for="titleColor">Countdown Title Color</label>
        <input type="color" id="titleColor" value="#b38f4e">
      </div>
    </div>

    <!-- Unit Label Settings -->
    <div class="section-title">Unit Labels (DAYS, HOURS, etc.)</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="showLabels">Unit Labels Display</label>
        <select id="showLabels">
          <option value="true">Show Labels</option>
          <option value="false">Hide Labels (Numbers only)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="labelCasing">Letter Casing</label>
        <select id="labelCasing">
          <option value="uppercase">ALL CAPS (e.g. DAYS, HOURS)</option>
          <option value="capitalize">Title Case (e.g. Days, Hours)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="labelSize">Label Font Size (px)</label>
        <input type="number" id="labelSize" value="11" min="8" max="28">
      </div>

      <div class="form-group">
        <label for="labelSpacing">Space Between Numbers & Labels (px)</label>
        <input type="range" id="labelSpacing" min="4" max="40" value="14">
        <span id="labelSpacingVal" style="font-size: 0.75rem; color: #78716c; text-align: right;">14px</span>
      </div>
    </div>

    <!-- Canva Layout Spacing & Colons -->
    <div class="section-title">Layout & Canva Integration</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="unitGap">Space Between Columns (px)</label>
        <input type="range" id="unitGap" min="10" max="150" value="65">
        <span id="unitGapVal" style="font-size: 0.75rem; color: #78716c; text-align: right;">65px gap</span>
      </div>

      <div class="form-group">
        <label for="colonToggle">Colon Separator (:)</label>
        <select id="colonToggle">
          <option value="false">Off (Clean empty space for Canva lines)</option>
          <option value="true">On (Show ':' colons between units)</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label for="leadingZero">Leading Zero Format</label>
        <select id="leadingZero">
          <option value="false">No Leading Zero (4, 10, 28)</option>
          <option value="true">Include Leading Zero (04, 10, 28)</option>
        </select>
      </div>
    </div>

    <!-- Output Section -->
    <div class="output-section">
      <label>Your Ready-to-Embed Canva Link:</label>
      <input type="text" class="output-url" id="generatedLink" readonly>
      <button class="copy-btn" id="copyBtn">Copy Link for Canva</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isEmbed = urlParams.get('embed') === 'true' || urlParams.has('date');

    const fontMap = {
      // Weddings
      'cormorant': "'Cormorant Garamond', Georgia, serif",
      'cinzel': "'Cinzel', Georgia, serif",
      'cinzel-dec': "'Cinzel Decorative', Georgia, serif",
      'pinyon': "'Pinyon Script', cursive",
      'alex-brush': "'Alex Brush', cursive",
      'great-vibes': "'Great Vibes', cursive",
      'prata': "'Prata', Georgia, serif",
      // Birthdays
      'quicksand': "'Quicksand', sans-serif",
      'comfortaa': "'Comfortaa', cursive",
      'fredoka': "'Fredoka', sans-serif",
      'shrikhand': "'Shrikhand', cursive",
      'dm-serif': "'DM Serif Display', Georgia, serif",
      'allura': "'Allura', cursive",
      // Anniversaries & Romance
      'bodoni': "'Bodoni Moda', Georgia, serif",
      'playfair': "'Playfair Display', Georgia, serif",
      'italiana': "'Italiana', Georgia, serif",
      'tangerine': "'Tangerine', cursive",
      'parisienne': "'Parisienne', cursive",
      'windsong': "'WindSong', cursive",
      // Corporate & Launches
      'montserrat': "'Montserrat', sans-serif",
      'jost': "'Jost', sans-serif",
      'outfit': "'Outfit', sans-serif",
      'space-grotesk': "'Space Grotesk', sans-serif",
      'castoro': "'Castoro Titling', Georgia, serif",
      // Parties & Celebrations
      'syne': "'Syne', sans-serif",
      'righteous': "'Righteous', cursive",
      'marcellus': "'Marcellus', Georgia, serif",
      'lora': "'Lora', Georgia, serif",
      'sacramento': "'Sacramento', cursive"
    };

    const labelNames = {
      'years': 'Years',
      'months': 'Months',
      'days': 'Days',
      'hours': 'Hours',
      'mins': 'Mins',
      'secs': 'Secs'
    };

    // Default configuration (luxurious & balanced out of the box)
    let targetTime = Date.now() + (92 * 86400000);
    let config = {
      title: 'Until We Say I Do',
      titlePos: 'above',
      titleColor: 'b38f4e',
      titleSize: 14,
      font: 'cormorant',
      color: '2e2620',
      lastColor: 'b38f4e',
      size: 54,
      gap: 65,
      colon: false,
      pad: false,
      labels: true,
      labelSize: 11,
      labelCase: 'uppercase', // 'uppercase' or 'capitalize'
      labelSpacing: 14,
      years: false,
      months: false,
      days: true,
      hours: true,
      mins: true,
      secs: true
    };

    const timerDisplay = document.getElementById('timerDisplay');
    const titleDisplay = document.getElementById('titleDisplay');
    const adminPanel = document.getElementById('adminPanel');
    const appHeader = document.getElementById('appHeader');

    // 1. EMBED MODE (Inside Canva)
    if (isEmbed) {
      document.body.classList.add('is-embed');
      adminPanel.style.display = 'none';
      appHeader.style.display = 'none';

      const dateP = urlParams.get('date');
      if (dateP) targetTime = new Date(dateP).getTime();

      config.title = urlParams.get('title') !== null ? urlParams.get('title') : config.title;
      config.titlePos = urlParams.get('tpos') || config.titlePos;
      config.titleColor = urlParams.get('tcolor') || config.titleColor;
      config.titleSize = parseInt(urlParams.get('tsize')) || config.titleSize;

      config.color = urlParams.get('color') || config.color;
      config.lastColor = urlParams.get('lcolor') || config.lastColor;
      config.font = urlParams.get('font') || config.font;
      config.size = parseInt(urlParams.get('size')) || config.size;
      config.gap = parseInt(urlParams.get('gap')) || config.gap;
      config.colon = urlParams.get('colon') === 'true';
      config.pad = urlParams.get('pad') === 'true';
      config.labels = urlParams.get('lbl') !== '0';
      config.labelSize = parseInt(urlParams.get('lblsize')) || config.labelSize;
      config.labelCase = urlParams.get('lblcase') || config.labelCase;
      config.labelSpacing = parseInt(urlParams.get('lblspace')) || config.labelSpacing;

      if (urlParams.has('y')) config.years = urlParams.get('y') === '1';
      if (urlParams.has('m')) config.months = urlParams.get('m') === '1';
      if (urlParams.has('d')) config.days = urlParams.get('d') === '1';
      if (urlParams.has('h')) config.hours = urlParams.get('h') === '1';
      if (urlParams.has('min')) config.mins = urlParams.get('min') === '1';
      if (urlParams.has('s')) config.secs = urlParams.get('s') === '1';

      buildDOM();
    } 
    // 2. GENERATOR STUDIO MODE
    else {
      const eventDateInput = document.getElementById('eventDate');
      const titleTextInput = document.getElementById('titleText');
      const titlePosInput = document.getElementById('titlePosition');
      const titleColorInput = document.getElementById('titleColor');
      const titleSizeInput = document.getElementById('titleSize');

      const textColorInput = document.getElementById('textColor');
      const lastDigitColorInput = document.getElementById('lastDigitColor');
      const fontSelect = document.getElementById('fontSelect');
      const fontSizeInput = document.getElementById('fontSize');
      const unitGapInput = document.getElementById('unitGap');
      const unitGapVal = document.getElementById('unitGapVal');
      const colonToggle = document.getElementById('colonToggle');
      const leadingZero = document.getElementById('leadingZero');

      const showLabels = document.getElementById('showLabels');
      const labelCasing = document.getElementById('labelCasing');
      const labelSizeInput = document.getElementById('labelSize');
      const labelSpacingInput = document.getElementById('labelSpacing');
      const labelSpacingVal = document.getElementById('labelSpacingVal');

      const showYears = document.getElementById('showYears');
      const showMonths = document.getElementById('showMonths');
      const showDays = document.getElementById('showDays');
      const showHours = document.getElementById('showHours');
      const showMins = document.getElementById('showMins');
      const showSecs = document.getElementById('showSecs');

      const generatedLink = document.getElementById('generatedLink');
      const copyBtn = document.getElementById('copyBtn');

      // Set default target to 92 days ahead
      const defaultDate = new Date(Date.now() + (92 * 86400000) + (10 * 3600000));
      defaultDate.setMinutes(defaultDate.getMinutes() - defaultDate.getTimezoneOffset());
      eventDateInput.value = defaultDate.toISOString().slice(0, 16);
      targetTime = new Date(eventDateInput.value).getTime();

      function updateFromUI() {
        if (eventDateInput.value) {
          targetTime = new Date(eventDateInput.value).getTime();
        }
        config.title = titleTextInput.value;
        config.titlePos = titlePosInput.value;
        config.titleColor = titleColorInput.value.replace('#', '');
        config.titleSize = titleSizeInput.value;

        config.color = textColorInput.value.replace('#', '');
        config.lastColor = lastDigitColorInput.value.replace('#', '');
        config.font = fontSelect.value;
        config.size = fontSizeInput.value;
        config.gap = unitGapInput.value;
        config.colon = colonToggle.value === 'true';
        config.pad = leadingZero.value === 'true';

        config.labels = showLabels.value === 'true';
        config.labelCase = labelCasing.value;
        config.labelSize = labelSizeInput.value;
        config.labelSpacing = labelSpacingInput.value;

        config.years = showYears.checked;
        config.months = showMonths.checked;
        config.days = showDays.checked;
        config.hours = showHours.checked;
        config.mins = showMins.checked;
        config.secs = showSecs.checked;

        unitGapVal.innerText = `${config.gap}px gap`;
        labelSpacingVal.innerText = `${config.labelSpacing}px`;

        buildDOM();

        // Build embed URL
        const base = window.location.origin + window.location.pathname;
        const dateIso = eventDateInput.value ? new Date(eventDateInput.value).toISOString() : '';
        const params = new URLSearchParams({
          date: dateIso,
          title: config.title,
          tpos: config.titlePos,
          tcolor: config.titleColor,
          tsize: config.titleSize,
          color: config.color,
          lcolor: config.lastColor,
          font: config.font,
          size: config.size,
          gap: config.gap,
          colon: config.colon,
          pad: config.pad,
          lbl: config.labels ? '1' : '0',
          lblsize: config.labelSize,
          lblcase: config.labelCase,
          lblspace: config.labelSpacing,
          y: config.years ? '1' : '0',
          m: config.months ? '1' : '0',
          d: config.days ? '1' : '0',
          h: config.hours ? '1' : '0',
          min: config.mins ? '1' : '0',
          s: config.secs ? '1' : '0',
          embed: 'true'
        });

        generatedLink.value = `${base}?${params.toString()}`;
      }

      eventDateInput.addEventListener('input', updateFromUI);
      titleTextInput.addEventListener('input', updateFromUI);
      titlePosInput.addEventListener('change', updateFromUI);
      titleColorInput.addEventListener('input', updateFromUI);
      titleSizeInput.addEventListener('input', updateFromUI);

      textColorInput.addEventListener('input', updateFromUI);
      lastDigitColorInput.addEventListener('input', updateFromUI);
      fontSelect.addEventListener('change', updateFromUI);
      fontSizeInput.addEventListener('input', updateFromUI);
      unitGapInput.addEventListener('input', updateFromUI);
      colonToggle.addEventListener('change', updateFromUI);
      leadingZero.addEventListener('change', updateFromUI);

      showLabels.addEventListener('change', updateFromUI);
      labelCasing.addEventListener('change', updateFromUI);
      labelSizeInput.addEventListener('input', updateFromUI);
      labelSpacingInput.addEventListener('input', updateFromUI);

      showYears.addEventListener('change', updateFromUI);
      showMonths.addEventListener('change', updateFromUI);
      showDays.addEventListener('change', updateFromUI);
      showHours.addEventListener('change', updateFromUI);
      showMins.addEventListener('change', updateFromUI);
      showSecs.addEventListener('change', updateFromUI);

      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(generatedLink.value);
        copyBtn.innerText = "Copied to Clipboard!";
        copyBtn.style.background = "#b38f4e";
        setTimeout(() => {
          copyBtn.innerText = "Copy Link for Canva";
          copyBtn.style.background = "#1c1917";
        }, 2000);
      });

      updateFromUI();
    }

    // Build the visual elements
    function buildDOM() {
      // 1. Title handling
      if (config.titlePos === 'none' || !config.title) {
        titleDisplay.style.display = 'none';
      } else {
        titleDisplay.style.display = 'block';
        titleDisplay.innerText = config.title;
        titleDisplay.style.color = `#${config.titleColor}`;
        titleDisplay.style.fontSize = `${config.titleSize}px`;
        titleDisplay.style.fontFamily = fontMap[config.font] || 'serif';
        if (config.titlePos === 'below') {
          titleDisplay.classList.add('pos-below');
        } else {
          titleDisplay.classList.remove('pos-below');
        }
      }

      // 2. Units & Columns handling
      timerDisplay.innerHTML = '';
      const activeUnits = [];
      if (config.years) activeUnits.push('years');
      if (config.months) activeUnits.push('months');
      if (config.days) activeUnits.push('days');
      if (config.hours) activeUnits.push('hours');
      if (config.mins) activeUnits.push('mins');
      if (config.secs) activeUnits.push('secs');

      activeUnits.forEach((unitKey, index) => {
        const isLast = (index === activeUnits.length - 1);
        const unitColor = isLast ? `#${config.lastColor}` : `#${config.color}`;

        // Create Unit Column
        const col = document.createElement('div');
        col.className = 'unit-column';

        if (index > 0) {
          col.style.marginLeft = `${config.gap}px`;
        }

        // Digit Slot
        const slot = document.createElement('span');
        slot.className = 'num-slot';
        slot.id = `unit-${unitKey}`;
        slot.style.fontFamily = fontMap[config.font] || 'serif';
        slot.style.fontSize = `${config.size}px`;
        slot.style.color = unitColor;
        slot.innerText = config.pad ? '00' : '0';
        col.appendChild(slot);

        // Label Slot (matches the color of the unit above)
        if (config.labels) {
          const lbl = document.createElement('span');
          lbl.className = 'unit-label';
          lbl.style.fontFamily = fontMap[config.font] || 'serif';
          lbl.style.fontSize = `${config.labelSize}px`;
          lbl.style.color = unitColor;
          lbl.style.marginTop = `${config.labelSpacing}px`;

          // Handle casing
          if (config.labelCase === 'capitalize') {
            lbl.style.textTransform = 'capitalize';
            lbl.style.letterSpacing = '0.08em'; // readable letter-spacing for cursive/title case
            lbl.innerText = labelNames[unitKey];
          } else {
            lbl.style.textTransform = 'uppercase';
            lbl.style.letterSpacing = '0.22em';
            lbl.innerText = labelNames[unitKey].toUpperCase();
          }

          col.appendChild(lbl);
        }

        timerDisplay.appendChild(col);

        // Colon Separator (if enabled and not after last unit)
        if (config.colon && !isLast) {
          const colon = document.createElement('span');
          colon.className = 'colon-separator';
          colon.style.fontFamily = fontMap[config.font] || 'serif';
          colon.style.fontSize = `${Math.round(config.size * 0.78)}px`;
          colon.style.color = `#${config.color}`;
          colon.style.marginLeft = `${Math.round(config.gap / 2)}px`;
          colon.style.height = `${config.size}px`;
          colon.innerText = ':';
          timerDisplay.appendChild(colon);
        }
      });

      renderCalculations();
    }

    // Interval Calculation
    function renderCalculations() {
      const now = new Date();
      const target = new Date(targetTime);
      let diff = target.getTime() - now.getTime();

      let years = 0, months = 0, days = 0, hours = 0, minutes = 0, seconds = 0;

      if (diff > 0) {
        if (config.years || config.months) {
          let tempDate = new Date(now.getTime());

          if (config.years) {
            let y = target.getFullYear() - tempDate.getFullYear();
            tempDate.setFullYear(tempDate.getFullYear() + y);
            if (tempDate > target) { y--; tempDate.setFullYear(tempDate.getFullYear() - 1); }
            years = Math.max(0, y);
          }

          if (config.months) {
            let m = 0;
            while (true) {
              let nextMonth = new Date(tempDate.getTime());
              nextMonth.setMonth(nextMonth.getMonth() + 1);
              if (nextMonth <= target) {
                m++;
                tempDate = nextMonth;
              } else {
                break;
              }
            }
            months = m;
          }
          diff = target.getTime() - tempDate.getTime();
        }

        days = Math.floor(diff / (1000 * 60 * 60 * 24));
        hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        seconds = Math.floor((diff % (1000 * 60)) / 1000);
      }

      const format = (n) => (config.pad && n < 10) ? `0${n}` : `${n}`;

      if (config.years && document.getElementById('unit-years')) document.getElementById('unit-years').innerText = format(years);
      if (config.months && document.getElementById('unit-months')) document.getElementById('unit-months').innerText = format(months);
      if (config.days && document.getElementById('unit-days')) document.getElementById('unit-days').innerText = format(days);
      if (config.hours && document.getElementById('unit-hours')) document.getElementById('unit-hours').innerText = format(hours);
      if (config.mins && document.getElementById('unit-mins')) document.getElementById('unit-mins').innerText = format(minutes);
      if (config.secs && document.getElementById('unit-secs')) document.getElementById('unit-secs').innerText = format(seconds);
    }

    setInterval(renderCalculations, 1000);
  </script>
</body>
